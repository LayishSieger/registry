# Version Packages PR on push to main when changesets are pending;
# GitHub Release + git tag when that PR merges. Does not publish to npm.
name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags for changesets/action, changelog-github, and tagging
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # @changesets/cli@3 requires ^22.11 || ^24 || >=26 (enableCompileCache)
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or GitHub Release
        uses: changesets/action@v2
        with:
          # private: true + privatePackages.tag → tags only, no npm publish
          # changesets/action@v2 renamed camelCase inputs to kebab-case
          publish-script: pnpm exec changeset publish
          pr-title: "Version Packages"
          commit-message: "chore: version packages"
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
